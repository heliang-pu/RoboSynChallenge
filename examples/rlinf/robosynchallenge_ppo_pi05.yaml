# ----------------------------------------------------------------------------
# RoboSynChallenge + pi0.5 的 PPO 后训练配置。
#
# 用 launch/rlinf_train.sh 启动,不要直接喂给 RLinf ——那个脚本负责把本文件链进
# RLinf 的 config 目录,并设好 PYTHONPATH / EMBODICHAIN_PATH / ROBOT_PLATFORM。
#
# 骨架取自 RLinf 的 robotwin_adjust_bottle_ppo_openpi_pi05.yaml(双臂 ALOHA + pi0.5
# 唯一现成的 PPO 例子),env 段换成 RoboSynChallenge。两处关键差异:
#
#   env_type: robosynchallenge   —— 不是 embodichain。RLinf 自带的 embodichain
#       适配器只有状态观测,没有图像通路;我们的类补齐了三路相机和语言指令。
#       注册见 scripts/patch_rlinf_env.py。
#
#   openpi.config_name: pi05_robosynchallenge —— 不是 pi05_aloha_robotwin。
#       后者用 AlohaInputs(adapt_to_pi=True) 会做 ALOHA 特有的关节翻转,
#       和 RoboSynChallenge 的 SFT checkpoint 对不上,而且不会报错。
#
# 标了 TODO 的值需要实测后再定,见 docs/tutorials/rlinf_ppo.md。
# ----------------------------------------------------------------------------
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # 8xH100。RLinf 会给每个组件进程单独设 CUDA_VISIBLE_DEVICES,
    # 组件共卡时靠 enable_offload 错峰用显存。
    actor, env, rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: robosynchallenge-rl
    experiment_name: "mixer_operating_ppo_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  # pi0.5 一次输出 50 步的 action chunk,奖励和 log-prob 都在 chunk 粒度上算
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 5
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0        # flow_sde 下 RLinf 用 0;换 flow_noise 时官方用 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: True

  train:
    env_type: robosynchallenge

    # 官方评测协议用的就是 random 这套随机化。换任务只需要改这一行和下面的
    # task_description / repo_id(见 robosynchallenge/rlinf_env/dataconfig.py)。
    gym_config_path: ${oc.env:ROBOSYN_PATH}/configs/mixer_operating/random/gym_config.json

    headless: true
    sim_device: cuda
    sim_cpu_num: 4        # 引擎默认单核跑物理,是扩展性瓶颈;见 total_num_envs 注释

    # 官方 max_episode_steps 取自各任务 random/gym_config.json:
    # mixer_operating 500 / water_pouring 500 / click_bell 361 /
    # table_rearrangement 361 / drawer_open_place 900
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500

    # 实测(4090, sim_cpu_num=4, 随机动作即部分重置最坏情形, 2026-08-25):
    #   per-instance envs:  1     4     8     16    32    64
    #   env-steps/s      : 18.5  29.9  25.3  22.0  13.5  崩(Vulkan 纹理耗尽)
    # 单实例甜点 4-8 env,再往上负收益;16 env 起 PhysX 还会警告
    # foundLostPairsCapacity 不足可能漏碰撞。所以并行度靠 RLinf 多 env worker 进程,
    # 每 worker 4-8 env。64 = 8 worker x 8 env,是 8xH100 的保守起点;
    # 显存不是瓶颈(单实例仅 ~50MB),CPU 核数才是: worker 数 x sim_cpu_num 别超机器核数。
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    rollout_epoch: 4

    auto_reset: True
    ignore_terminations: False
    reward_coef: ${algorithm.reward_coef}
    is_eval: False

    # --- 本仓库的 RoboSynChallengeVLAEnv 额外读的字段 ---
    main_camera: cam_high
    wrist_cameras: ["cam_left_wrist", "cam_right_wrist"]
    image_size: 224          # 原图 640x480;不缩放的话跨进程要多搬 4.6 倍数据
    state_key: qpos
    success_reward: 1.0
    terminate_on_success: True   # 官方 is_task_success() 为真即结束,省仿真步数
    task_description: null       # null = 从 gym_config 的 instruction 字段取

    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    env_type: robosynchallenge
    gym_config_path: ${oc.env:ROBOSYN_PATH}/configs/mixer_operating/random/gym_config.json
    headless: true
    sim_device: cuda
    sim_cpu_num: 4
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    total_num_envs: 64
    group_size: 1
    rollout_epoch: 1
    auto_reset: True
    # 评测时不早停,让每集跑满,成功率口径才和官方评测一致
    ignore_terminations: True
    reward_coef: ${algorithm.reward_coef}
    is_eval: True

    main_camera: cam_high
    wrist_cameras: ["cam_left_wrist", "cam_right_wrist"]
    image_size: 224
    state_key: qpos
    success_reward: 1.0
    terminate_on_success: False
    task_description: null

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 1234
  enable_offload: True

  model:
    # scripts/convert_pi05_jax_to_torch.py 的输出目录(含 model.safetensors + assets)
    model_path: ${oc.env:ROBOSYN_PI05_TORCH_CKPT}
    num_action_chunks: 50    # = openpi Pi0Config.action_horizon
    action_dim: 14           # CobotMagic 双臂:每臂 6 关节 + 1 夹爪
    add_value_head: True
    num_steps: 5             # flow matching 的积分步数
    openpi:
      config_name: "pi05_robosynchallenge"
      num_images_in_input: 3      # cam_high + 左右腕
      noise_level: 0.3
      noise_method: "flow_sde"    # ODE 转 SDE 注噪,让 flow 有可算的 log-prob
      detach_critic_input: True

    # norm_stats 的位置。RLinf 默认按 <model_path>/<asset_id>/norm_stats.json 找,
    # 而 openpi 训练产物(以及 scripts/convert_pi05_jax_to_torch.py 的输出)的布局是
    # <model_path>/assets/<asset_id>/norm_stats.json —— 差一层 assets/,不指定就
    # FileNotFoundError。换任务时这里要跟着改成对应任务的 asset 目录:
    # 归一化统计量是按任务算的,用错任务的会让策略输出整体偏移且不报错。
    # 这个块只能放 norm_stats_path 一个键:其余键会被原样塞进 openpi 的 DataConfig。
    openpi_data:
      norm_stats_path: ${actor.model.model_path}/assets/RoboSynChallenge/cobotmagic_Sim_mixer_operating

  optim:
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False   # openpi 不支持,别改
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
