        raw_shape: 1
        shape: 1
        time_offset: 0
      images:
      - key: cam_high
        camera_type: exterior
        lerobot_key: observation.images.cam_high
        start_index: 0
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 256
        - 256
        time_offset: 0
      - key: cam_left_wrist
        camera_type: wrist_left
