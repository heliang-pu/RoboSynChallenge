# =============================================================================
# pi0.5 (openpi) 独立 uv 环境 —— JAX 训练栈
# =============================================================================
#
# 安装方式(按需选择,不要全仓库统一装):
#
#   只训练(clone 本仓库即可,无需任何私有资源;需要 CUDA 12 + Python 3.11):
#     cd policy/pi05 && uv sync
#     # 或者什么都不装,直接 bash finetune.sh ...(内部用 uv run --frozen,
#     # 首次运行会按 uv.lock 自动创建环境)
#
#   训练 + 仿真评估(eval.sh,额外要求见下):
#     cd policy/pi05 && uv sync --extra sim
#     前置: 1) EmbodiChain 仓库 clone 在本仓库同级目录(../../../EmbodiChain)
#           2) 有 dexsim-engine 私有 pip 源(open3dv)的访问权限
#
#   RLDS 数据转换(可选): uv sync --group rlds(注意 tensorflow-cpu 2.15
#   只有 cp311 轮子,venv 必须是 Python 3.11)。
#
#   改动本文件后需要重新锁定: uv lock(锁定会解析 sim extra,需要上面
#   两个前置条件;没有条件的用户请勿改依赖后重锁,直接用仓库自带的
#   uv.lock + --frozen)。
# =============================================================================

[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }

# ---- 训练/推理核心依赖(全部公开源) ----
dependencies = [
    "augmax>=0.3.4",                    # JAX 图像增广
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",                     # JAX 神经网络库(模型定义)
    "fsspec[gcs]>=2024.6.0",            # 从 gs://openpi-assets 拉基座权重
    "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",               # 训练主框架,CUDA 12
    "jaxtyping==0.2.36",
    "lerobot",                          # 数据加载,版本由下方 git rev 锁定
    "ml_collections==1.0.0",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "openpi-client",                    # 推理客户端(本仓库 packages/ 内)
    "orbax-checkpoint==0.11.13",        # checkpoint 存取
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",             # PaliGemma tokenizer
    "torch==2.7.1",                     # 仅数据管线用(训练是 JAX)
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",                      # CLI 配置解析
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "treescope>=0.1.7",
    "transformers==4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
]

# ---- 可选依赖:仿真评估(eval.sh 需要;只训练则不用装) ----
[project.optional-dependencies]
sim = [
    "embodichain",                      # 仿真框架,本地路径(见 tool.uv.sources)
    "robosynchallenge",                 # 本仓库根包(任务配置/评估协议)
    "dexsim-engine==0.4.1",             # 闭源仿真引擎,私有源,需要权限
]

[project.urls]
Repository = "https://github.com/Physical-Intelligence/openpi"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
rlds = [
    # NOTE: tensorflow-cpu 2.15.0 only ships cp311 wheels on PyPI.
    # Use `uv venv --python 3.11` before `uv sync --group rlds`.
    "dlimp",
    "tensorflow-cpu==2.15.0",
    "tensorflow-datasets==4.9.9",
]

[tool.uv]
# 私有源走 http,必须显式放行
allow-insecure-host = ["pyp.open3dv.site:2345"]
override-dependencies = [
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
    # EmbodiChain asks for tensorboard>=2.20.0, but the RLDS stack pins
    # tensorflow-cpu==2.15.0, whose metadata requires tensorboard>=2.15,<2.16.
    # This workspace uses TensorBoard only as a logging backend, so prefer the
    # TensorFlow-compatible TensorBoard range when resolving pi05+rlds.
    "tensorboard>=2.15,<2.16",
    # EmbodiChain declares lerobot>=0.4.4, but openpi depends on this older
    # LeRobot tree. Evaluation disables EmbodiChain dataset saving, so the
    # newer recorder-only LeRobot dependency is not needed here.
    "lerobot",
    "av==15.1.0",
    # EmbodiChain 声明 dexsim-engine==0.4.3,但 openpi 的评估适配层
    # 是针对 0.4.1 写的;评估时以 0.4.1 为准。
    "dexsim-engine==0.4.1",
]

[tool.uv.sources]
openpi-client = { workspace = true }
# lerobot 固定到特定 commit,保证数据管线行为可复现
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }
# EmbodiChain 必须 clone 在本仓库同级目录(仅安装 sim extra 时需要存在)
embodichain = { path = "../../../EmbodiChain", editable = true }
robosynchallenge = { path = "../..", editable = true }
dexsim-engine = { index = "open3dv" }

[[tool.uv.index]]
name = "open3dv"
url = "http://pyp.open3dv.site:2345/simple/"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docker", "third_party", "src/openpi/models_pytorch/transformers_replace/*"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
