# Motus Policy Evaluation Configuration
# python scripts/eval_policy.py --config policy/motus/deploy_policy.yml

# ------------------------------------------------------------------
# Basic experiment configuration (Each policy must be retained.)
# ------------------------------------------------------------------
policy_name: motus
task_name: null
setting: null
model_name: null
seed: 0
max_episodes: 20
max_steps: 1000 # Maximum environment steps per episode. Effective limit is max(deploy_config.max_steps, gym_config.max_episode_steps).
headless: false
pytorch_device: cpu
filter_dataset_saving: true
eval_video_log: true
eval_video_obs_key: cam_high

# ------------------------------------------------------------------
# Add policy-related parameters you needing, used for get_model()
# ------------------------------------------------------------------

# --- weights -------------------------------------------------------
# ckpt_path: directory that contains mp_rank_00_model_states.pt (searched
# recursively). Overridable with $MOTUS_CKPT or eval.sh's 3rd argument.
ckpt_path: /home/phl/workspace/models/motus/Motus_robotwin2
# Wan2.2-TI2V-5B: supplies Wan2.2_VAE.pth, models_t5_umt5-xxl-enc-bf16.pth and
# google/umt5-xxl. Only the VAE is needed once instructions are T5-cached.
wan_path: /home/phl/workspace/models/motus/Wan2.2-TI2V-5B
# Qwen3-VL-2B-Instruct: processor + config only, the weights come from ckpt_path.
vlm_path: /home/phl/workspace/models/motus/Qwen3-VL-2B-Instruct

# --- model geometry ------------------------------------------------
# MUST match the config the checkpoint was trained with.
#   configs/robosyn_infer.yml    -> our fine-tune  (chunk 48, downsample 1)
#   configs/robotwin2_infer.yml  -> released Motus_robotwin2 (chunk 16, downsample 3)
model_config: configs/robosyn_infer.yml

# --- inference / execution ----------------------------------------
num_inference_timesteps: 10   # denoising steps; lower = faster, less accurate
execute_steps: 24             # actions consumed per inference (of a 48-chunk)
action_repeat: 1              # env steps each action is held; set 3 for robotwin2_infer
action_normalization: none    # "none" for robotwin-format training (stats are
                              # NOT applied there); "minmax" only for a checkpoint
                              # fine-tuned through Motus' LeRobot loader.
stat_path: configs/stat.json  # used only when action_normalization: minmax
embodiment_type: robosyn

# --- embodiment fixups --------------------------------------------
gripper_indices: [6, 13]
gripper_scale: 1.0            # 0.05 maps RoboTwin's 0..1 gripper onto 0..0.05
gripper_limits: null          # e.g. [0.0, 0.05] to clamp
action_clip: null             # [[min x14], [max x14]]

# --- language ------------------------------------------------------
# auto: encode once on GPU then free the encoder (~9.4GB) -> ~24GB steady state
# cpu / keep (~41GB peak) / cache_only (never load the encoder)
t5_mode: auto
t5_cache_dir: null            # default policy/motus/cache/t5

# --- debug ---------------------------------------------------------
save_video_debug: false       # dump the predicted future frames per inference
